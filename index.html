<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Anonymous project page for Robotic Spatiotemporal Editing: A Unified Controllable Action Interface via Masked Action Reconstruction.">
  <meta name="color-scheme" content="light">
  <title>Robotic Spatiotemporal Editing</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #172033; background: #fff; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
    main { max-width: 1240px; margin: 0 auto; padding: 72px 32px 48px; text-align: center; }
    .eyebrow { margin: 0 0 22px; color: #526076; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.7; }
    h1 { max-width: 1040px; margin: 0 auto; font-size: clamp(27px, 3.3vw, 42px); font-weight: 700; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
    .title { display: block; margin-bottom: 12px; color: #214b8e; }
    .subtitle { display: block; font-size: .78em; font-weight: 500; letter-spacing: -.015em; line-height: 1.4; }
    figure { margin: 52px 0 0; padding-top: 28px; border-top: 1px solid #e1e6ee; }
    .figure-link { display: block; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 24px; }
    .full-size { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px; border: 1px solid #d5dde9; border-radius: 6px; color: #214b8e; font-size: 14px; line-height: 1.4; text-underline-offset: 3px; }
    .full-size:hover { background: #f2f5fa; }
    a:focus-visible { outline: 3px solid #214b8e; outline-offset: 5px; }
    @media (max-width: 600px) {
      main { padding: 40px 16px 32px; }
      .eyebrow { font-size: 11px; letter-spacing: .04em; }
      figure { margin-top: 32px; padding-top: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Inpainting Policy · Anonymous project page</p>
      <h1><span class="title">Robotic Spatiotemporal Editing:</span> <span class="subtitle">A Unified Controllable Action Interface via Masked Action Reconstruction</span></h1>
    </header>
    <figure>
      <a class="figure-link" href="overview.png" aria-label="View the overview figure at full resolution">
        <img src="overview.png" width="4127" height="1737" alt="Overview of the Masked Action Space interface and Inpainting Policy: motion references specify parts of a temporal Cartesian action matrix, and the policy reconstructs the remaining components.">
      </a>
      <figcaption><a class="full-size" href="overview.png">View full-resolution figure <span aria-hidden="true">&nbsp;↗</span></a></figcaption>
    </figure>
